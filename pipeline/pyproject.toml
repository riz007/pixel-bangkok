[project]
name = "pixel-bangkok-pipeline"
version = "0.1.0"
description = "Offline asset-generation pipeline for Pixel Bangkok"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.5.4",
  "osmium>=4.3.2",
  "pillow>=11",
  "pyproj>=3.7",
  "rasterio>=1.5.2",
  "shapely>=2.0",
]

[project.scripts]
pixel-bangkok = "pixel_bangkok.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pixel_bangkok"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
